name: Example Service Build
# NOTE: This is an example/test service - it should NEVER deploy to Production
on:
  push:
    branches:
      - Development
      # Production intentionally excluded - this is a test service only
    paths:
      - 'example-service/**'
      - '.github/workflows/example-build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Development
    paths:
      - 'example-service/**'
      - '.github/workflows/example-build.yml'
  workflow_dispatch:

jobs:
  SetDeployEnv:
    name: 'Set Deployment Environment'
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.determine-env.outputs.environment }}

    steps:
      - name: Determine Environment
        id: determine-env
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            ENV_NAME="${{ github.base_ref }}"
          else
            ENV_NAME="${GITHUB_REF##*/}"
          fi

          # Safety check: Never allow Production deployment for example service
          if [ "$ENV_NAME" == "Production" ]; then
            echo "ERROR: Example service cannot be deployed to Production!"
            exit 1
          fi

          echo "environment=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "TARGET_ENVIRONMENT=$ENV_NAME" >> $GITHUB_ENV

  test:
    name: 'Run Build Check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: snowflake-cache

      - name: Checkout db-cache dependency
        uses: actions/checkout@v4
        with:
          repository: transactrx/db-cache
          path: db-cache

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: snowflake-cache/example-service/go.sum

      - name: Build example-service
        working-directory: snowflake-cache/example-service
        run: go build -v ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: [SetDeployEnv, test]  # Build only runs if test job succeeds
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ needs.SetDeployEnv.outputs.deploy_env }}
    env:
      PROJECT_NAME: example-service

    steps:
      - name: Setup Environment
        run: |
          # Use the target environment (not source branch) for AWS role
          targetEnv="${{ needs.SetDeployEnv.outputs.deploy_env }}"
          envUpper=$(echo ${targetEnv^^})
          role_name_prefix="RAS_DATA_SERVICES_"
          role_name_suffix="_AWS_ROLE_ARN"
          AWS_ROLE=$role_name_prefix$envUpper$role_name_suffix
          echo "AWS_ROLE=$(echo $AWS_ROLE)"  >> $GITHUB_ENV
          echo '${{ toJSON(vars) }}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets[env.AWS_ROLE] }}
          role-session-name: example-service
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: snowflake-cache

      - name: Checkout db-cache dependency
        uses: actions/checkout@v4
        with:
          repository: transactrx/db-cache
          path: db-cache

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: snowflake-cache/example-service/go.sum

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configure Terraform Backend
        run: |
          bucket=$(aws ssm get-parameter --name terraform_state_bucket_name|jq -r .Parameter.Value)
          lock_table=$(aws ssm get-parameter --name terraform_lock_table|jq -r .Parameter.Value)
          cd snowflake-cache/example-service/terraform
          terraform init -backend-config="bucket=$bucket" -backend-config="key=$PROJECT_NAME"  -backend-config="region=us-east-1"  -backend-config="dynamodb_table=$lock_table" -input=false -upgrade

      # Create ECR repository FIRST (before trying to push images)
      # Note: Terraform validates all variables even with -target, so we must set them all
      - name: Create ECR Repository
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_REPO_NAME="transactrx/$PROJECT_NAME"
          export TF_VAR_project_name=$PROJECT_NAME
          export TF_VAR_aws_region=us-east-1

          DEPLOY_ENV="${{ needs.SetDeployEnv.outputs.deploy_env }}"
          ECS_CLUSTER_SUFFIX=$(echo "$DEPLOY_ENV" | tr '[:upper:]' '[:lower:]' | sed 's/development/dev/;s/production/prod/')
          export TF_VAR_ecs_cluster_name="rasdataservices-$ECS_CLUSTER_SUFFIX"

          export TF_VAR_memory_mb=512
          export TF_VAR_desired_count=1
          export TF_VAR_cpu_units=256

          # Snowflake environment (required for stream registration)
          export TF_VAR_snowflake_env='DEV'

          # Snowflake connection (hardcoded for example service)
          export TF_VAR_snowflake_account='dwwwkin-east'
          export TF_VAR_snowflake_database='CPE_DEV'
          export TF_VAR_snowflake_schema='DATA'

          # SQL queries for cache comparison
          export TF_VAR_snowflake_sql='SELECT ID, PHARMACY_ID, SWITCH_SERVICE_ID, RANK, COPAY_PROGRAM_TYPE, ENABLED, REASON, PPE_RULE_BASE_ID FROM PHARMACY_SWITCH_SERVICE'
          export TF_VAR_postgres_sql='SELECT id AS "ID", pharmacy_id AS "PHARMACY_ID", switch_service_id AS "SWITCH_SERVICE_ID", rank AS "RANK", copay_program_type AS "COPAY_PROGRAM_TYPE", enabled AS "ENABLED", reason AS "REASON", ppe_rule_base_id AS "PPE_RULE_BASE_ID" FROM public.pharmacy_switch_service'

          # Comparison settings
          export TF_VAR_comparison_interval='5m'
          export TF_VAR_cache_check_interval='60s'
          export TF_VAR_max_detailed_mismatches=100
          export TF_VAR_monitored_tables='PHARMACY_SWITCH_SERVICE'
          export TF_VAR_key_field='PharmacyID'
          export TF_VAR_log_level='info'

          export TF_VAR_image_full=$(echo "$ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG")

          cd snowflake-cache/example-service/terraform
          terraform apply -input=false -auto-approve -target=aws_ecr_repository.repository

      # Now build and push image to the newly created ECR repo
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # ECR repo name matches what Terraform creates: transactrx/example-service
          ECR_REPO_NAME="transactrx/$PROJECT_NAME"
          echo "Building image for $ECR_REPO_NAME"
          # Build context is the parent directory containing both snowflake-cache/ and db-cache/
          # Dockerfile expects this structure for the replace directives to work
          docker build -f snowflake-cache/example-service/Dockerfile -t $ECR_REGISTRY/$ECR_REPO_NAME:latest -t $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPO_NAME:latest
          docker push $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG

      # Deploy the rest of the infrastructure (ECS service, task definition, etc.)
      - name: Deploy terraform Resources
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # ECR repo name matches what Terraform creates
          ECR_REPO_NAME="transactrx/$PROJECT_NAME"
          export TF_VAR_project_name=$PROJECT_NAME
          export TF_VAR_aws_region=us-east-1

          DEPLOY_ENV="${{ needs.SetDeployEnv.outputs.deploy_env }}"
          ECS_CLUSTER_SUFFIX=$(echo "$DEPLOY_ENV" | tr '[:upper:]' '[:lower:]' | sed 's/development/dev/;s/production/prod/')
          export TF_VAR_ecs_cluster_name="rasdataservices-$ECS_CLUSTER_SUFFIX"

          export TF_VAR_memory_mb=512
          export TF_VAR_desired_count=1
          export TF_VAR_cpu_units=256

          # Snowflake environment (required for stream registration)
          export TF_VAR_snowflake_env='DEV'

          # Snowflake connection (hardcoded for example service)
          export TF_VAR_snowflake_account='dwwwkin-east'
          export TF_VAR_snowflake_database='CPE_DEV'
          export TF_VAR_snowflake_schema='DATA'

          # SQL queries for cache comparison
          export TF_VAR_snowflake_sql='SELECT ID, PHARMACY_ID, SWITCH_SERVICE_ID, RANK, COPAY_PROGRAM_TYPE, ENABLED, REASON, PPE_RULE_BASE_ID FROM PHARMACY_SWITCH_SERVICE'
          export TF_VAR_postgres_sql='SELECT id AS "ID", pharmacy_id AS "PHARMACY_ID", switch_service_id AS "SWITCH_SERVICE_ID", rank AS "RANK", copay_program_type AS "COPAY_PROGRAM_TYPE", enabled AS "ENABLED", reason AS "REASON", ppe_rule_base_id AS "PPE_RULE_BASE_ID" FROM public.pharmacy_switch_service'

          # Comparison settings
          export TF_VAR_comparison_interval='5m'
          export TF_VAR_cache_check_interval='60s'
          export TF_VAR_max_detailed_mismatches=100
          export TF_VAR_monitored_tables='PHARMACY_SWITCH_SERVICE'
          export TF_VAR_key_field='PharmacyID'
          export TF_VAR_log_level='info'

          export TF_VAR_image_full=$(echo "$ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG")

          cd snowflake-cache/example-service/terraform
          terraform apply -input=false -auto-approve
